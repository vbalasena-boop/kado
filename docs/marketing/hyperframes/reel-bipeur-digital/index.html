<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Playfair+Display:ital,wght@1,700&display=swap">
<style>
:root{--paper:#f4efe5;--ink:#292331;--plum:#33204d;--pepper:#e85b3d;--sun:#efc64f;--soft:#665c61}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:100%;height:100%;background:var(--paper) radial-gradient(#d9cebf 1.5px,transparent 1.5px) 0 0/28px 28px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:100px}
h1{font-size:118px;line-height:1.04;font-weight:800;letter-spacing:-4px;color:var(--plum)}
h1 em{font-family:'Playfair Display',serif;font-style:italic;color:var(--pepper);letter-spacing:-1px}
p{font-size:52px;line-height:1.3;color:var(--soft);margin-top:44px;font-weight:500}
.prizes{display:flex;gap:24px;margin-top:50px}.prizes b{font-size:84px;background:#fbf8f1;border:4px solid var(--plum);border-radius:24px;width:128px;height:128px;display:flex;align-items:center;justify-content:center;box-shadow:7px 7px 0 var(--sun);font-weight:400}.phone{width:420px;padding:44px;margin-top:60px;border-radius:36px;background:#fbf8f1;border:4px solid #33204d;box-shadow:16px 16px 0 #efc64f;font-size:56px;font-weight:800;color:#33204d}.phone small{display:block;font-size:34px;color:#665c61;font-weight:500;margin-bottom:12px}.list{margin-top:50px;text-align:left;font-size:52px;font-weight:700;color:#33204d;line-height:1.7}.list b{color:#e85b3d}.qr{width:380px;height:380px;background:#fbf8f1;border:4px solid var(--plum);border-radius:28px;margin-top:60px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:34px;box-shadow:14px 14px 0 var(--sun)}
.qr i{background:var(--plum);border-radius:6px}.qr i.o{background:transparent}
.wheel{width:560px;height:560px;border-radius:50%;margin-top:60px;border:14px solid #fbf8f1;box-shadow:0 0 0 7px var(--plum),16px 18px 0 var(--sun);background:conic-gradient(#dc563d 0 60deg,#5d795f 0 120deg,#e9b849 0 180deg,#82709a 0 240deg,#d28068 0 300deg,#33294a 0 360deg)}
.card{width:640px;padding:50px;margin-top:60px;border-radius:32px;background:#fbf8f1;border:4px solid var(--plum);box-shadow:16px 16px 0 var(--sun);font-size:46px;font-weight:700}
.dots{display:flex;gap:22px;justify-content:center;margin-top:34px}.dots b{width:64px;height:64px;border-radius:50%;background:var(--pepper)}.dots b.e{background:transparent;border:4px solid var(--soft)}
.cta{margin-top:60px;background:var(--pepper);color:#fff;font-weight:800;font-size:56px;padding:32px 64px;border-radius:24px;box-shadow:9px 9px 0 var(--plum)}
.logo{position:absolute;right:70px;bottom:70px;font-size:60px;font-weight:800;color:var(--plum)}
</style>
  </head>
  <body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
<div id="s1" class="scene clip" data-start="0" data-duration="4" data-track-index="0"><h1>Fini les boîtiers qui <em>disparaissent.</em></h1></div>
<div id="s2" class="scene clip" data-start="4" data-duration="4" data-track-index="0"><h1>Le client <em>commande</em></h1><div class="phone"><small>Votre numéro</small>N° 42</div></div>
<div id="s3" class="scene clip" data-start="8" data-duration="4" data-track-index="0"><h1>Le commerce <em>prévient</em></h1><div class="phone"><small>Votre commande</small>Elle est prête ! 🔔</div></div>
<div id="s4" class="scene clip" data-start="12" data-duration="4" data-track-index="0"><h1>Sans boîtier, sans <em>matériel.</em></h1><p>Le bipeur digital est inclus dans la formule Comptoir.</p><div class="cta">kado-app.fr</div></div>
<div class="logo">kado</div></div>
<script>
window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
tl.fromTo("#s1 > *",{opacity:0,y:50},{opacity:1,y:0,duration:0.6,stagger:0.15,ease:"power3.out"},0);tl.to("#s1",{opacity:0,duration:0.3},3.7);
tl.fromTo("#s2 > *",{opacity:0,y:50},{opacity:1,y:0,duration:0.6,stagger:0.15,ease:"power3.out"},4);tl.to("#s2",{opacity:0,duration:0.3},7.7);
tl.fromTo("#s3 > *",{opacity:0,y:50},{opacity:1,y:0,duration:0.6,stagger:0.15,ease:"power3.out"},8);tl.to("#s3",{opacity:0,duration:0.3},11.7);
tl.fromTo("#s4 > *",{opacity:0,y:50},{opacity:1,y:0,duration:0.6,stagger:0.15,ease:"power3.out"},12);tl.to("#s4",{opacity:0,duration:0.3},15.7);
window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
