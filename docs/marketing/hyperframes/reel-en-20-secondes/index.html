<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --ground:#130a20; --ink:#f2edfb; --dim:#a99cc6; --gold:#ecc474; --coral:#f2657f; --mint:#46caa0; --violet:#8f74ff; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:var(--ground); }
      #root { position:relative; width:100%; height:100%; background:radial-gradient(900px 800px at 80% 0,#2c1c52,#130a20 70%); font-family:Georgia,serif; color:var(--ink); }
      .scene { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:100px; }
      h1 { font-size:110px; line-height:1.1; font-weight:700; }
      h1 em { color:var(--gold); font-style:italic; }
      p { font-family:Helvetica,Arial,sans-serif; font-size:52px; line-height:1.3; color:var(--dim); margin-top:44px; }
      .qr { width:380px; height:380px; background:#f2edfb; border-radius:28px; margin-top:60px; display:grid; grid-template-columns:repeat(7,1fr); gap:10px; padding:34px; }
      .qr i { background:#130a20; border-radius:6px; } .qr i.o { background:transparent; }
      .wheel { width:560px; height:560px; border-radius:50%; margin-top:60px; border:14px solid var(--ink); background:conic-gradient(#ecc474 0 60deg,#f2657f 0 120deg,#46caa0 0 180deg,#8f74ff 0 240deg,#ecc474 0 300deg,#f2657f 0 360deg); }
      .card { width:620px; padding:50px; margin-top:60px; border-radius:36px; background:#1c1333; border:3px solid #ecc474; font-family:Helvetica; font-size:44px; }
      .dots { display:flex; gap:22px; justify-content:center; margin-top:34px; } .dots b { width:64px; height:64px; border-radius:50%; background:#ecc474; } .dots b.e { background:transparent; border:4px solid #a99cc6; }
      .cta { margin-top:60px; background:var(--gold); color:#130a20; font-family:Helvetica; font-weight:700; font-size:52px; padding:32px 64px; border-radius:70px; }
      .logo { position:absolute; right:70px; bottom:70px; font-size:56px; font-weight:700; color:var(--gold); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="s1" class="scene clip" data-start="0" data-duration="4" data-track-index="0"><h1>Et si vos clients avaient <em>envie de revenir ?</em></h1></div>
      <div id="s2" class="scene clip" data-start="4" data-duration="4" data-track-index="0"><h1>Un <em>QR code</em><br>au comptoir.</h1>
        <div class="qr" id="qr"></div></div>
      <div id="s3" class="scene clip" data-start="8" data-duration="4" data-track-index="0"><h1>Un petit <em>tour de roue.</em></h1><div class="wheel" id="wheel"></div><p>Un cadeau à venir chercher en boutique.</p></div>
      <div id="s4" class="scene clip" data-start="12" data-duration="4" data-track-index="0"><h1>Et une carte de <em>fidélité.</em></h1>
        <div class="card" id="card">Carte de fidélité<div class="dots"><b></b><b></b><b></b><b class="e"></b><b class="e"></b></div></div></div>
      <div id="s5" class="scene clip" data-start="16" data-duration="4" data-track-index="0"><h1>Un petit jeu.<br><em>Une vraie raison de revenir.</em></h1><p>Essai 14 jours gratuit, sans CB</p><div class="cta">kado-app.fr</div></div>
      <div class="logo">Kado</div>
    </div>
    <script>
      const q = document.getElementById("qr"); const pat="1110111101010111010100010101101110101011101"; 
      for (let i=0;i<49;i++){ const e=document.createElement("i"); if(!((i*7+(i>>2))%3)) e.className="o"; q.appendChild(e); }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true });
      [["#s1",0],["#s2",4],["#s3",8],["#s4",12],["#s5",16]].forEach(([id,t])=>{
        tl.fromTo(id+" > *",{opacity:0,y:50},{opacity:1,y:0,duration:0.6,stagger:0.15,ease:"power3.out"},t);
        tl.to(id,{opacity:0,duration:0.3},t+3.7);
      });
      tl.fromTo("#wheel",{rotation:0},{rotation:1080,duration:3,ease:"power3.out"},8.3);
      tl.fromTo("#card .dots b.e",{scale:0.6},{scale:1,duration:0.5,stagger:0.3,yoyo:true,repeat:1},13.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
