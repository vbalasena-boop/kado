<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Playfair+Display:ital,wght@1,700&display=swap">
<style>
:root{--paper:#f4efe5;--ink:#292331;--plum:#33204d;--pepper:#e85b3d;--sun:#efc64f;--soft:#665c61}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#root{position:relative;width:100%;height:100%;background:var(--paper) radial-gradient(#d9cebf 1.5px,transparent 1.5px) 0 0/28px 28px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:100px}
h1{font-size:118px;line-height:1.04;font-weight:800;letter-spacing:-4px;color:var(--plum)}
h1 em{font-family:'Playfair Display',serif;font-style:italic;color:var(--pepper);letter-spacing:-1px}
p{font-size:52px;line-height:1.3;color:var(--soft);margin-top:44px;font-weight:500}
.prizes{display:flex;gap:24px;margin-top:50px}.prizes b{font-size:84px;background:#fbf8f1;border:4px solid var(--plum);border-radius:24px;width:128px;height:128px;display:flex;align-items:center;justify-content:center;box-shadow:7px 7px 0 var(--sun);font-weight:400}.qr{width:380px;height:380px;background:#fbf8f1;border:4px solid var(--plum);border-radius:28px;margin-top:60px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:34px;box-shadow:14px 14px 0 var(--sun)}
.qr i{background:var(--plum);border-radius:6px}.qr i.o{background:transparent}
.wheel{width:560px;height:560px;border-radius:50%;margin-top:60px;border:14px solid #fbf8f1;box-shadow:0 0 0 7px var(--plum),16px 18px 0 var(--sun);background:conic-gradient(#dc563d 0 60deg,#5d795f 0 120deg,#e9b849 0 180deg,#82709a 0 240deg,#d28068 0 300deg,#33294a 0 360deg)}
.card{width:640px;padding:50px;margin-top:60px;border-radius:32px;background:#fbf8f1;border:4px solid var(--plum);box-shadow:16px 16px 0 var(--sun);font-size:46px;font-weight:700}
.dots{display:flex;gap:22px;justify-content:center;margin-top:34px}.dots b{width:64px;height:64px;border-radius:50%;background:var(--pepper)}.dots b.e{background:transparent;border:4px solid var(--soft)}
.cta{margin-top:60px;background:var(--pepper);color:#fff;font-weight:800;font-size:56px;padding:32px 64px;border-radius:24px;box-shadow:9px 9px 0 var(--plum)}
.logo{position:absolute;right:70px;bottom:70px;font-size:60px;font-weight:800;color:var(--plum)}
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="s1" class="scene clip" data-start="0" data-duration="4" data-track-index="0"><h1>Et si vos clients avaient <em>envie de revenir ?</em></h1></div>
      <div id="s2" class="scene clip" data-start="4" data-duration="4" data-track-index="0"><h1>Un <em>QR code</em><br>au comptoir.</h1>
        <div class="qr" id="qr"></div></div>
      <div id="s3" class="scene clip" data-start="8" data-duration="4" data-track-index="0"><h1>Un petit <em>tour de roue.</em></h1><div class="wheel" id="wheel"></div><div class="prizes"><b>🎁</b><b>☕</b><b>🍰</b><b>🏷️</b><b>🍹</b></div><p>Des cadeaux à venir chercher en boutique.</p></div>
      <div id="s4" class="scene clip" data-start="12" data-duration="4" data-track-index="0"><h1>Et une carte de <em>fidélité.</em></h1>
        <div class="card" id="card">Carte de fidélité<div class="dots"><b></b><b></b><b></b><b class="e"></b><b class="e"></b></div></div></div>
      <div id="s5" class="scene clip" data-start="16" data-duration="4" data-track-index="0"><h1>Un petit jeu.<br><em>Une vraie raison de revenir.</em></h1><p>Essai 14 jours gratuit, sans CB</p><div class="cta">kado-app.fr</div></div>
      <div class="logo">kado</div>
    </div>
    <script>
      const q = document.getElementById("qr"); const pat="1110111101010111010100010101101110101011101"; 
      for (let i=0;i<49;i++){ const e=document.createElement("i"); if(!((i*7+(i>>2))%3)) e.className="o"; q.appendChild(e); }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true });
      [["#s1",0],["#s2",4],["#s3",8],["#s4",12],["#s5",16]].forEach(([id,t])=>{
        tl.fromTo(id+" > *",{opacity:0,y:50},{opacity:1,y:0,duration:0.6,stagger:0.15,ease:"power3.out"},t);
        tl.to(id,{opacity:0,duration:0.3},t+3.7);
      });
      tl.fromTo("#s3 .prizes b",{scale:0.5,opacity:0},{scale:1,opacity:1,duration:0.4,stagger:0.12,ease:"back.out(2)"},10.2);
      tl.fromTo("#wheel",{rotation:0},{rotation:1080,duration:3,ease:"power3.out"},8.3);
      tl.fromTo("#card .dots b.e",{scale:0.6},{scale:1,duration:0.5,stagger:0.3,yoyo:true,repeat:1},13.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
